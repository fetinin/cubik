[tools]
golangci-lint = "v2.8.0"
go = '1.25'
bun = '1.3'

[tasks.build]
description = "Build the CLI"
sources = ["**/*.go", "go.mod", "go.sum"]
run = "go build"

[tasks.back-lint]
description = "Run golangci-lint"
sources = ["**/*.go", ".golangci.yml"]
run = "golangci-lint run"

[tasks.back-fmt]
description = "Run golangci-lint with auto-fix"
sources = ["**/*.go", ".golangci.yml"]
run = "golangci-lint run --fix"

[tasks.back-dev]
description = "Run the Go backend server"
sources = ["**/*.go"]
run = "go run ."

[tasks.front-dev]
description = "Run the frontend dev server"
dir = "front"
sources = ["**/*.ts", "**/*.svelte"]
run = "bun run dev --open"

[tasks.dev]
description = "Run backend and frontend in parallel"
run = [{ tasks = ["back-dev", "front-dev"] }]

[tasks.back-gen]
description = "Generate backend API code from spec.yml"
sources = ["spec.yml", "generate.go"]
outputs = ["api/**/*"]
run = "go generate ./..."

[tasks.front-gen]
description = "Generate frontend API client from spec.yml"
dir = "front"
sources = ["../spec.yml"]
outputs = ["src/api/generated/**/*"]
run = "bun run generate-api"

[tasks.gen]
description = "Generate both backend and frontend API code"
run = [{ tasks = ["back-gen", "front-gen"] }]

[tasks.release]
description = "Create a GitHub release with date-based tag"
run = "bun scripts/release.ts"

[tasks.back-test]
description = "Run Go backend tests"
sources = ["**/*.go", "go.mod", "go.sum"]
run = "go test ./..."

[tasks.front-test]
description = "Run frontend tests"
dir = "front"
sources = ["**/*.ts", "**/*.svelte"]
run = "bun run test"

[tasks.test]
description = "Run all tests (backend and frontend)"
run = [{ tasks = ["back-test", "front-test"] }]

[tasks.front-check]
description = "Run frontend type checking"
dir = "front"
sources = ["**/*.ts", "**/*.svelte", "tsconfig.json"]
run = "bun run check"

[tasks.front-lint]
description = "Run frontend linting (ESLint + Prettier check)"
dir = "front"
sources = ["**/*.ts", "**/*.svelte", "**/*.js", "eslint.config.js"]
run = "bun run lint"

[tasks.front-fmt]
description = "Format frontend code with Prettier"
dir = "front"
sources = ["**/*.ts", "**/*.svelte", "**/*.js", "*.json", ".prettierrc"]
run = "bun run format"

[tasks.lint]
description = "Run all linters (backend and frontend)"
run = [{ tasks = ["back-lint", "front-lint"] }]

[tasks.fmt]
description = "Format all code (backend and frontend)"
run = [{ tasks = ["back-fmt", "front-fmt"] }]

[tasks.check]
description = "Run all checks (tests, lint, type check)"
run = [{ tasks = ["test", "lint", "front-check"] }]
